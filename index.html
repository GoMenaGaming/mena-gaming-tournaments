<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MENA Gaming Tournaments</title>
<meta name="color-scheme" content="dark">
<style>
:root {
  --bg:#0b0710;
  --panel:#15101d;
  --panel-2:#1b1127;
  --purple:#a62bff;
  --purple2:#6f18b7;
  --accent:#d965ff;
  --text:#fff;
  --muted:#bcb5c6;
  --green:#63f7a6;
  --red:#ff6d7a;
  --amber:#ffc36b;
  --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}
body{padding:16px}
a{color:inherit}
.mg-shell{max-width:1180px;margin:0 auto}
.mg-topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
.mg-brand{display:flex;align-items:center;gap:14px}
.mg-brand img{width:140px;max-height:54px;object-fit:contain}
.mg-brand-copy strong{display:block;font-size:13px;letter-spacing:.12em;color:#fff}
.mg-brand-copy span{font-size:12px;color:var(--muted)}
.mg-live-pill{padding:8px 12px;border-radius:999px;border:1px solid rgba(217,101,255,.45);background:rgba(166,43,255,.08);font-size:12px;font-weight:800;color:#eab9ff}

.mg-hero{position:relative;overflow:hidden;border:1px solid rgba(166,43,255,.42);background:
radial-gradient(circle at 85% 15%,rgba(166,43,255,.28),transparent 34%),
linear-gradient(135deg,#17101f,#0d0913 70%);border-radius:26px;padding:32px;margin-bottom:28px}
.mg-hero::after{content:"";position:absolute;inset:auto -140px -180px auto;width:360px;height:360px;border-radius:50%;background:rgba(166,43,255,.12);filter:blur(18px)}
.mg-hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(250px,.75fr);gap:28px;align-items:center;position:relative;z-index:1}
.mg-kicker{font-size:12px;font-weight:900;letter-spacing:.16em;color:#dfa2ff;margin-bottom:10px}
.mg-hero h1{font-size:clamp(32px,5vw,56px);line-height:1;margin:0 0 8px;font-weight:950}
.mg-ar-title{font-size:22px;color:#ded3e7;font-weight:800;margin-bottom:16px}
.mg-hero .desc{color:var(--muted);font-size:16px;line-height:1.65;max-width:760px}
.mg-hero-logo-wrap{display:flex;align-items:center;justify-content:center;min-height:220px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(166,43,255,.10));border:1px solid var(--line);padding:26px}
.mg-hero-logo{max-width:90%;max-height:170px;object-fit:contain;filter:drop-shadow(0 12px 28px rgba(0,0,0,.38))}
.mg-logo-fallback{font-size:58px;font-weight:950;letter-spacing:-.04em;text-align:center;color:#fff}
.mg-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.04em;margin-bottom:16px}
.mg-badge.open{background:rgba(38,194,114,.11);border:1px solid rgba(99,247,166,.45);color:var(--green)}
.mg-badge.live{background:rgba(255,74,95,.10);border:1px solid rgba(255,109,122,.45);color:var(--red)}
.mg-badge.upcoming{background:rgba(166,43,255,.10);border:1px solid rgba(217,101,255,.42);color:#dfa2ff}
.mg-badge.completed{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#d1ccd6}
.mg-badge.cancelled{background:rgba(255,172,72,.08);border:1px solid rgba(255,195,107,.38);color:var(--amber)}
.mg-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}
.mg-stat{padding:13px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.mg-stat small{display:block;color:#918a9b;font-size:10px;font-weight:900;letter-spacing:.08em;margin-bottom:6px}
.mg-stat strong{font-size:14px;line-height:1.35}
.mg-stat .ar{font-size:11px;color:#aea5b7;margin-top:3px}
.mg-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.mg-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 18px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:900;border:1px solid transparent;transition:.18s ease}
.mg-btn:hover{transform:translateY(-2px)}
.mg-primary{background:linear-gradient(135deg,var(--purple),#c844ff);color:#fff;box-shadow:0 10px 24px rgba(166,43,255,.22)}
.mg-secondary{border-color:rgba(217,101,255,.40);background:rgba(166,43,255,.08);color:#e3a9ff}

.mg-controls{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin:0 0 24px}
.mg-search,.mg-select{min-height:45px;border-radius:12px;border:1px solid var(--line);background:#130d19;color:#fff;padding:0 14px;font-size:14px;outline:none}
.mg-search:focus,.mg-select:focus{border-color:rgba(217,101,255,.62)}
.mg-section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:28px 0 14px}
.mg-section-head h2{margin:0;font-size:23px}
.mg-section-head span{color:var(--muted);font-size:13px}
.mg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mg-card{display:flex;flex-direction:column;border-radius:19px;padding:18px;background:linear-gradient(145deg,#17101f,#100b16);border:1px solid var(--line);min-width:0}
.mg-card:hover{border-color:rgba(217,101,255,.38)}
.mg-card-logo{height:130px;border-radius:14px;background:linear-gradient(135deg,#0f0b14,#1f0f2e);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;padding:20px;margin-bottom:15px}
.mg-card-logo img{max-width:92%;max-height:94px;object-fit:contain}
.mg-card-logo .fallback{font-weight:950;font-size:28px;text-align:center}
.mg-card h3{margin:2px 0 3px;font-size:18px}
.mg-card .title-ar{color:#bfb5c9;font-size:13px;margin-bottom:14px;min-height:18px}
.mg-card-data{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0 4px}
.mg-mini{padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.055)}
.mg-mini small{display:block;color:#8d8596;font-size:9px;font-weight:900;margin-bottom:4px}
.mg-mini strong{font-size:12px;line-height:1.25}
.mg-card .mg-actions{margin-top:auto;padding-top:15px}
.mg-card .mg-btn{width:100%}
.mg-empty,.mg-error,.mg-loading{padding:35px;text-align:center;border-radius:18px;background:#15101d;border:1px solid var(--line);color:var(--muted)}
.mg-error{border-color:rgba(255,109,122,.35)}
.mg-loading-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--accent);box-shadow:16px 0 0 rgba(217,101,255,.55),32px 0 0 rgba(217,101,255,.25);margin-right:38px;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.mg-footer{text-align:center;color:#7f7789;font-size:11px;padding:22px 0 5px}
@media(max-width:850px){.mg-hero-grid{grid-template-columns:1fr}.mg-grid{grid-template-columns:1fr 1fr}.mg-stats{grid-template-columns:1fr 1fr}}
@media(max-width:600px){body{padding:8px}.mg-topbar{align-items:flex-start}.mg-brand-copy{display:none}.mg-brand img{width:112px}.mg-hero{padding:22px}.mg-grid{grid-template-columns:1fr}.mg-controls{grid-template-columns:1fr}.mg-section-head{align-items:flex-start;flex-direction:column;gap:4px}}
</style>
</head>

<script>
(() => {
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTGbqjXpSt-4SadiyCdjIcKE-LIWrmLwWlJLd7ykHad9E5-EfXGioXCL4RP8-PfDxL6T_ptFj7yaWr5/pub?gid=1130184947&single=true&output=csv";

  const fallbackLogos = {
    "tekken 8": "https://tk8.tekken-official.jp/images/streamingkit/logo_sample.png",
    "ea sports fc 27": "https://drop-assets.ea.com/images/7yoMZ6xTTBIOiJzyuuaS9l/7df7927425c4bcfda0b1603453f2ec44/EA_FC27_STD_KeyArt_RGB_16-9_3840x2160__1_.jpg?im=AspectCrop%3D%2816%2C9%29%2CxPosition%3D0.5%2CyPosition%3D0.5"
  };

  const $ = s => document.querySelector(s);
  let all = [];

  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
  }

  function parseCSV(text) {
    const rows=[]; let row=[], cell="", q=false;
    for (let i=0;i<text.length;i++) {
      const c=text[i], n=text[i+1];
      if (q) {
        if (c === '"' && n === '"') { cell += '"'; i++; }
        else if (c === '"') q=false;
        else cell += c;
      } else {
        if (c === '"') q=true;
        else if (c === ',') { row.push(cell); cell=""; }
        else if (c === '\n') { row.push(cell.replace(/\r$/,"")); rows.push(row); row=[]; cell=""; }
        else cell += c;
      }
    }
    if (cell.length || row.length) { row.push(cell.replace(/\r$/,"")); rows.push(row); }
    return rows;
  }

  function normalize(rows) {
    if (!rows.length) return [];
    const headers=rows[0].map(h=>h.trim());
    return rows.slice(1).filter(r=>r.some(v=>String(v).trim()!=="")).map(r=>{
      const o={}; headers.forEach((h,i)=>o[h]=r[i]??""); return o;
    });
  }

  function safeUrl(v) {
    const s=String(v||"").trim();
    return /^https?:\/\//i.test(s) ? s : "";
  }

  function logoFor(t) {
    return safeUrl(t.Image_URL) || fallbackLogos[String(t.Game||"").trim().toLowerCase()] || "";
  }

  function badge(status) {
    const s=String(status||"UPCOMING").trim().toUpperCase();
    const ar={OPEN:"التسجيل مفتوح",LIVE:"مباشر الآن",UPCOMING:"قريباً",COMPLETED:"انتهت",CANCELLED:"ملغاة"}[s]||"قريباً";
    return `<div class="mg-badge ${s.toLowerCase()}">${s==="OPEN"?"● ":s==="LIVE"?"● ":""}${esc(s)} · <span dir="rtl">${ar}</span></div>`;
  }

  function logoMarkup(t, cls="mg-card-logo") {
    const u=logoFor(t);
    if (u) return `<div class="${cls}"><img src="${esc(u)}" alt="${esc(t.Game||"Game")}" onerror="this.parentElement.innerHTML='<div class=&quot;fallback&quot;>${esc(t.Game||"GAME")}</div>'"></div>`;
    return `<div class="${cls}"><div class="fallback">${esc(t.Game||"GAME")}</div></div>`;
  }

  function players(t) {
    const r=parseInt(t.Registered_Players||"0",10)||0, m=parseInt(t.Max_Players||"0",10)||0;
    return m ? `${r} / ${m}` : "TBA";
  }

  function btns(t) {
    const reg=safeUrl(t.Registration_URL), rules=safeUrl(t.Rules_URL), bracket=safeUrl(t.Bracket_URL), discord=safeUrl(t.Discord_URL);
    let x="";
    if(reg) x+=`<a class="mg-btn mg-primary" href="${esc(reg)}" target="_top">JOIN TOURNAMENT · انضم إلى البطولة</a>`;
    if(rules) x+=`<a class="mg-btn mg-secondary" href="${esc(rules)}" target="_top">RULES · القوانين</a>`;
    if(bracket) x+=`<a class="mg-btn mg-secondary" href="${esc(bracket)}" target="_top">BRACKET · الجدول</a>`;
    if(discord) x+=`<a class="mg-btn mg-secondary" href="${esc(discord)}" target="_blank" rel="noopener">DISCORD</a>`;
    return x;
  }

  function stat(label, value, ar="") {
    return `<div class="mg-stat"><small>${esc(label)}</small><strong>${esc(value||"TBA")}</strong>${ar?`<div class="ar" dir="rtl">${esc(ar)}</div>`:""}</div>`;
  }

  function renderFeatured() {
    const t = all.find(x=>String(x.Featured).trim().toUpperCase()==="YES") || all.find(x=>String(x.Status).trim().toUpperCase()==="OPEN") || all[0];
    if(!t) { $("#featured").innerHTML=""; return; }
    $("#featured").innerHTML = `
      <section class="mg-hero">
        <div class="mg-hero-grid">
          <div>
            <div class="mg-kicker">FEATURED TOURNAMENT · البطولة الرئيسية</div>
            ${badge(t.Status)}
            <h1>${esc(t.Title_EN||t.Game||"Tournament")}</h1>
            <div class="mg-ar-title" dir="rtl">${esc(t.Title_AR||"")}</div>
            <div class="desc">Compete, climb the bracket and claim the weekly prize.<br><span dir="rtl">نافس، تقدّم في البطولة، واحصل على الجائزة الأسبوعية.</span></div>
            <div class="mg-stats">
              ${stat("DATE · التاريخ",t.Date)}
              ${stat("PRIZE · الجائزة",t.Prize_EN,t.Prize_AR)}
              ${stat("PLAYERS · اللاعبون",players(t))}
              ${stat("PLATFORM · المنصة",t.Platform)}
            </div>
            <div class="mg-actions">${btns(t)}</div>
          </div>
          ${logoMarkup(t,"mg-hero-logo-wrap").replace('class="mg-hero-logo-wrap"><img','class="mg-hero-logo-wrap"><img class="mg-hero-logo"')}
        </div>
      </section>`;
  }

  function renderCards() {
    const q=$("#search").value.trim().toLowerCase(), g=$("#gameFilter").value, s=$("#statusFilter").value;
    const list=all.filter(t=>{
      const blob=[t.Game,t.Title_EN,t.Title_AR,t.Prize_EN,t.Platform].join(" ").toLowerCase();
      return (!q||blob.includes(q)) && (!g||t.Game===g) && (!s||String(t.Status).trim().toUpperCase()===s);
    });
    $("#countText").textContent=`${list.length} tournament${list.length===1?"":"s"}`;
    if(!list.length) { $("#cards").className="mg-empty"; $("#cards").innerHTML="No matching tournaments · لا توجد بطولات مطابقة"; return; }
    $("#cards").className="mg-grid";
    $("#cards").innerHTML=list.map(t=>`
      <article class="mg-card">
        ${logoMarkup(t)}
        ${badge(t.Status)}
        <h3>${esc(t.Title_EN||t.Game||"Tournament")}</h3>
        <div class="title-ar" dir="rtl">${esc(t.Title_AR||"")}</div>
        <div class="mg-card-data">
          <div class="mg-mini"><small>DATE</small><strong>${esc(t.Date||"TBA")}</strong></div>
          <div class="mg-mini"><small>PRIZE</small><strong>${esc(t.Prize_EN||"TBA")}</strong></div>
          <div class="mg-mini"><small>PLAYERS</small><strong>${esc(players(t))}</strong></div>
          <div class="mg-mini"><small>PLATFORM</small><strong>${esc(t.Platform||"TBA")}</strong></div>
        </div>
        <div class="mg-actions">${btns(t)}</div>
      </article>`).join("");
  }

  function populateFilters() {
    const games=[...new Set(all.map(t=>t.Game).filter(Boolean))].sort();
    $("#gameFilter").innerHTML='<option value="">All games · جميع الألعاب</option>'+games.map(g=>`<option>${esc(g)}</option>`).join("");
  }

  async function load() {
    try {
      const res=await fetch(CSV_URL,{cache:"no-store"});
      if(!res.ok) throw new Error("Google Sheets returned "+res.status);
      const text=await res.text();
      all=normalize(parseCSV(text)).filter(t=>String(t.Visible||"").trim().toUpperCase()==="YES");
      renderFeatured(); populateFilters(); renderCards();
    } catch(e) {
      $("#cards").className="mg-error";
      $("#cards").innerHTML=`<strong>Could not load tournament data.</strong><br><br>${esc(e.message)}<br><br><span dir="rtl">تعذر تحميل بيانات البطولات.</span>`;
    }
  }

  $("#search").addEventListener("input",renderCards);
  $("#gameFilter").addEventListener("change",renderCards);
  $("#statusFilter").addEventListener("change",renderCards);

  load();
  setInterval(load,60000);
})();
</script>
</body>
</html>

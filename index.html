<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MENA Gaming Tournaments</title>
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#0b0710;--panel:#17101f;--purple:#a62bff;--purple2:#c84cff;--text:#fff;--muted:#bdb5c8;--line:rgba(255,255,255,.09);--green:#63f7a6;--red:#ff707c;--amber:#ffc36b}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{padding:14px}
.mg{max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}
.brand img{width:150px;max-height:58px;object-fit:contain}
.free{padding:8px 12px;border:1px solid rgba(200,76,255,.42);background:rgba(166,43,255,.08);border-radius:999px;color:#e4b2ff;font-size:12px;font-weight:800}
.hero{border:1px solid rgba(200,76,255,.4);border-radius:26px;padding:30px;background:radial-gradient(circle at 85% 10%,rgba(166,43,255,.28),transparent 36%),linear-gradient(145deg,#191020,#0d0912);margin-bottom:25px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(240px,.8fr);gap:26px;align-items:center}
.kicker{font-size:11px;letter-spacing:.14em;color:#dda4ff;font-weight:900;margin-bottom:10px}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1;margin:0 0 7px;font-weight:950}
.ar-title{font-size:21px;font-weight:800;color:#d9d0df;margin-bottom:15px}
.desc{font-size:15px;line-height:1.65;color:var(--muted)}
.hero-art{min-height:210px;border-radius:20px;background:linear-gradient(135deg,#100b15,#241032);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);padding:25px}
.hero-art img{max-width:92%;max-height:160px;object-fit:contain}
.fallback{font-size:27px;font-weight:950;text-align:center}
.badge{display:inline-flex;padding:7px 11px;border-radius:999px;font-size:11px;font-weight:900;margin-bottom:14px}
.open{color:var(--green);background:rgba(40,196,111,.1);border:1px solid rgba(99,247,166,.42)}
.live{color:var(--red);background:rgba(255,70,88,.1);border:1px solid rgba(255,112,124,.42)}
.upcoming{color:#dda4ff;background:rgba(166,43,255,.1);border:1px solid rgba(221,164,255,.4)}
.completed{color:#d1cad5;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14)}
.cancelled{color:var(--amber);background:rgba(255,180,80,.08);border:1px solid rgba(255,195,107,.38)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:20px}
.stat{padding:12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.stat small{display:block;color:#8e8696;font-size:9px;font-weight:900;margin-bottom:5px}
.stat strong{font-size:13px;line-height:1.3}
.stat .ar{font-size:10px;color:#aaa2b2;margin-top:3px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;min-height:44px;padding:10px 16px;border-radius:11px;font-size:12px;font-weight:900}
.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff}
.secondary{border:1px solid rgba(200,76,255,.42);background:rgba(166,43,255,.07);color:#e0a5ff}
.controls{display:grid;grid-template-columns:1fr minmax(220px,320px) auto;gap:9px;margin:0 0 20px}
input,select,.picker-button{height:44px;border-radius:11px;border:1px solid var(--line);background:#130d19;color:#fff;padding:0 13px;font-size:13px}
.picker{position:relative}
.picker-button{width:100%;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.picker-selected{display:flex;align-items:center;gap:9px;min-width:0}
.picker-selected img{width:30px;height:24px;object-fit:contain}
.picker-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-menu{display:none;position:absolute;z-index:50;left:0;right:0;top:49px;max-height:390px;overflow:auto;border:1px solid rgba(200,76,255,.45);background:#100b16;border-radius:14px;padding:7px;box-shadow:0 18px 45px rgba(0,0,0,.45)}
.picker.open .picker-menu{display:block}
.game-option{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;cursor:pointer}
.game-option:hover{background:rgba(166,43,255,.13)}
.game-option img{width:45px;height:30px;object-fit:contain;background:#1b1127;border-radius:6px;padding:3px}
.game-option .game-copy{min-width:0}
.game-option strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-option small{display:block;color:#8e8696;font-size:9px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:26px 0 13px;gap:12px}
.section-head h2{margin:0;font-size:22px}
.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.card{display:flex;flex-direction:column;min-width:0;background:linear-gradient(145deg,#17101f,#100b16);border:1px solid var(--line);border-radius:18px;padding:17px}
.card-art{height:125px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:linear-gradient(135deg,#100b14,#251033);border:1px solid rgba(255,255,255,.06);padding:18px;margin-bottom:14px}
.card-art img{max-width:92%;max-height:92px;object-fit:contain}
.card h3{margin:2px 0 4px;font-size:17px}
.card-ar{color:#bfb5c9;font-size:12px;min-height:18px;margin-bottom:12px}
.data{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mini{padding:9px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
.mini small{display:block;color:#888091;font-size:8px;font-weight:900;margin-bottom:4px}
.mini strong{font-size:11px;line-height:1.3}
.card .actions{margin-top:auto;padding-top:13px}
.card .btn{width:100%}
.message{padding:35px;border-radius:17px;border:1px solid var(--line);background:#15101d;color:var(--muted);text-align:center;line-height:1.7}
.error{border-color:rgba(255,112,124,.35)}
.footer{padding:20px 0 4px;text-align:center;color:#716a78;font-size:10px}
@media(max-width:850px){.hero-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr 1fr}}
@media(max-width:600px){body{padding:8px}.brand img{width:115px}.free{font-size:10px}.hero{padding:21px}.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}}
</style>
</head>

    return (table.rows || []).map(r => {
      const obj = {};
      headers.forEach((h, i) => { if (h) obj[h] = getCell(r.c ? r.c[i] : null); });
      return obj;
    });
  }

  function catalogGame(name) {
    const n = String(name || "").trim().toLowerCase();
    return GAME_CATALOG.find(g => g.name.toLowerCase() === n) || null;
  }

  function assetsFor(t) {
    const cat = catalogGame(t.Game);
    return {
      logo: safeUrl(t.Image_URL) || safeUrl(t.Auto_Logo_URL) || (cat ? cat.logo : ""),
      art: safeUrl(t.Auto_Art_URL) || (cat ? cat.art : "")
    };
  }

  function imgMarkup(url, art, name) {
    if (!url && art) url = art;
    if (!url) return `<div class="fallback">${esc(name || "GAME")}</div>`;
    const onerr = art && art !== url
      ? `if(!this.dataset.fallbackUsed){this.dataset.fallbackUsed='1';this.src='${esc(art)}';}else{this.parentElement.innerHTML='<div class=&quot;fallback&quot;>${esc(name||"GAME")}</div>';}`
      : `this.parentElement.innerHTML='<div class=&quot;fallback&quot;>${esc(name||"GAME")}</div>';`;
    return `<img src="${esc(url)}" alt="${esc(name||"Game")}" onerror="${onerr}">`;
  }

  function art(t, hero=false) {
    const a = assetsFor(t);
    return `<div class="${hero ? "hero-art" : "card-art"}">${imgMarkup(a.logo, a.art, t.Game)}</div>`;
  }

  function badge(status) {
    const s = String(status || "UPCOMING").trim().toUpperCase();
    const ar = {OPEN:"التسجيل مفتوح",LIVE:"مباشر الآن",UPCOMING:"قريباً",COMPLETED:"انتهت",CANCELLED:"ملغاة"}[s] || "قريباً";
    return `<div class="badge ${s.toLowerCase()}">${s === "OPEN" || s === "LIVE" ? "● " : ""}${esc(s)} · <span dir="rtl">${ar}</span></div>`;
  }

  function players(t) {
    const registered = parseInt(t.Registered_Players || "0", 10) || 0;
    const max = parseInt(t.Max_Players || "0", 10) || 0;
    return max ? `${registered} / ${max}` : "TBA";
  }

  function buttons(t) {
    const reg = safeUrl(t.Registration_URL), rules = safeUrl(t.Rules_URL), bracket = safeUrl(t.Bracket_URL), discord = safeUrl(t.Discord_URL);
    let html = "";
    if (reg) html += `<a class="btn primary" href="${esc(reg)}" target="_top">JOIN TOURNAMENT · انضم إلى البطولة</a>`;
    if (rules) html += `<a class="btn secondary" href="${esc(rules)}" target="_top">RULES · القوانين</a>`;
    if (bracket) html += `<a class="btn secondary" href="${esc(bracket)}" target="_top">BRACKET · الجدول</a>`;
    if (discord) html += `<a class="btn secondary" href="${esc(discord)}" target="_blank">DISCORD</a>`;
    return html;
  }

  function stat(label, value, ar="") {
    return `<div class="stat"><small>${esc(label)}</small><strong>${esc(value || "TBA")}</strong>${ar ? `<div class="ar" dir="rtl">${esc(ar)}</div>` : ""}</div>`;
  }

  function renderFeatured() {
    const filtered = selectedGame ? all.filter(x => x.Game === selectedGame) : all;
    const t = filtered.find(x => String(x.Featured).trim().toUpperCase() === "YES")
      || filtered.find(x => String(x.Status).trim().toUpperCase() === "OPEN")
      || filtered[0];

    if (!t) {
      $("#featured").innerHTML = "";
      return;
    }

    $("#featured").innerHTML = `
      <section class="hero">
        <div class="hero-grid">
          <div>
            <div class="kicker">FEATURED TOURNAMENT · البطولة الرئيسية</div>
            ${badge(t.Status)}
            <h1>${esc(t.Title_EN || t.Game || "Tournament")}</h1>
            <div class="ar-title" dir="rtl">${esc(t.Title_AR || "")}</div>
            <div class="desc">Compete, climb the bracket and claim the weekly prize.<br><span dir="rtl">نافس، تقدّم في البطولة، واحصل على الجائزة الأسبوعية.</span></div>
            <div class="stats">
              ${stat("DATE · التاريخ", t.Date)}
              ${stat("PRIZE · الجائزة", t.Prize_EN, t.Prize_AR)}
              ${stat("PLAYERS · اللاعبون", players(t))}
              ${stat("PLATFORM · المنصة", t.Platform)}
            </div>
            <div class="actions">${buttons(t)}</div>
          </div>
          ${art(t, true)}
        </div>
      </section>`;
  }

  function renderCards() {
    const q = $("#search").value.trim().toLowerCase();
    const status = $("#statusFilter").value;

    const list = all.filter(t => {
      const searchable = [t.Game,t.Title_EN,t.Title_AR,t.Prize_EN,t.Platform].join(" ").toLowerCase();
      return (!q || searchable.includes(q))
        && (!selectedGame || t.Game === selectedGame)
        && (!status || String(t.Status).trim().toUpperCase() === status);
    });

    $("#count").textContent = `${list.length} tournament${list.length === 1 ? "" : "s"}`;

    if (!list.length) {
      $("#cards").className = "message";
      $("#cards").innerHTML = selectedGame
        ? `No active tournaments for <strong>${esc(selectedGame)}</strong> yet.<br><span dir="rtl">لا توجد بطولات حالية لهذه اللعبة.</span>`
        : "No matching tournaments · لا توجد بطولات مطابقة";
      return;
    }

    $("#cards").className = "grid";
    $("#cards").innerHTML = list.map(t => `
      <article class="card">
        ${art(t, false)}
        ${badge(t.Status)}
        <h3>${esc(t.Title_EN || t.Game || "Tournament")}</h3>
        <div class="card-ar" dir="rtl">${esc(t.Title_AR || "")}</div>
        <div class="data">
          <div class="mini"><small>DATE</small><strong>${esc(t.Date || "TBA")}</strong></div>
          <div class="mini"><small>PRIZE</small><strong>${esc(t.Prize_EN || "TBA")}</strong></div>
          <div class="mini"><small>PLAYERS</small><strong>${esc(players(t))}</strong></div>
          <div class="mini"><small>PLATFORM</small><strong>${esc(t.Platform || "TBA")}</strong></div>
        </div>
        <div class="actions">${buttons(t)}</div>
      </article>`).join("");
  }

  function renderPicker() {
    const menu = $("#gamePickerMenu");
    const options = [
      `<div class="game-option" data-game=""><div class="game-copy"><strong>All games · جميع الألعاب</strong><small>Show every active tournament</small></div></div>`
    ];

    GAME_CATALOG.forEach(g => {
      const preview = imgMarkup(g.logo, g.art, g.name);
      options.push(`
        <div class="game-option" data-game="${esc(g.name)}">
          <div style="width:45px;height:30px;display:flex;align-items:center;justify-content:center">${preview}</div>
          <div class="game-copy">
            <strong>${esc(g.name)}</strong>
            <small>${esc(g.category)} · ${esc(g.era)}</small>
          </div>
        </div>`);
    });

    menu.innerHTML = options.join("");

    menu.querySelectorAll(".game-option").forEach(el => {
      el.addEventListener("click", () => {
        selectedGame = el.dataset.game || "";
        const g = catalogGame(selectedGame);
        $("#pickerSelected").innerHTML = selectedGame
          ? `${g ? `<span style="width:30px;height:24px;display:flex;align-items:center;justify-content:center">${imgMarkup(g.logo,g.art,g.name)}</span>` : ""}<span class="picker-label">${esc(selectedGame)}</span>`
          : `<span class="picker-label">All games · جميع الألعاب</span>`;
        $("#gamePicker").classList.remove("open");
        renderFeatured();
        renderCards();
      });
    });
  }

  function showError(message) {
    $("#cards").className = "message error";
    $("#cards").innerHTML = `<strong>Could not load tournament data.</strong><br><br>${esc(message)}<br><br><span dir="rtl">تعذر تحميل بيانات البطولات.</span>`;
  }

  window.receiveMenaData = function(response) {
    try {
      if (!response) return showError("Google Sheets returned no response.");
      if (response.status && response.status !== "ok") {
        const detail = response.errors && response.errors.length
          ? response.errors.map(e => e.detailed_message || e.message || "").join(" | ")
          : "Google Sheets returned an error.";
        return showError(detail);
      }
      if (!response.table) return showError("The sheet response did not contain table data.");

      all = tableToObjects(response.table).filter(t => String(t.Visible || "").trim().toUpperCase() === "YES");
      renderPicker();
      renderFeatured();
      renderCards();

    } catch (err) {
      showError(err.message || String(err));
    }
  };

  function loadSheet() {
    const old = document.getElementById("google-sheet-loader");
    if (old) old.remove();
    const script = document.createElement("script");
    script.id = "google-sheet-loader";
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&headers=1&tq=${encodeURIComponent("select *")}&tqx=responseHandler:receiveMenaData&_=${Date.now()}`;
    script.onerror = () => showError("Google Sheets could not be reached. Make sure the sheet is shared as Anyone with the link → Viewer.");
    document.body.appendChild(script);
  }

  $("#search").addEventListener("input", renderCards);
  $("#statusFilter").addEventListener("change", renderCards);
  $("#gamePickerButton").addEventListener("click", () => $("#gamePicker").classList.toggle("open"));
  document.addEventListener("click", e => {
    if (!$("#gamePicker").contains(e.target)) $("#gamePicker").classList.remove("open");
  });

  renderPicker();
  loadSheet();
  setInterval(loadSheet, 60000);
})();
</script>
</body>
</html>
